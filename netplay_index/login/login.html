{% extends "../base.html" %}
{% block title %}登录{% end %}
{% block content %}
<form method="POST">
  {% module xsrf_form_html() %}
  <div class="form-group row">
    <label for="username" class="col-form-label col-sm-2">用户名</label>
    <input type="text" class="form-control col-sm-10" name="username">
  </div>
  <div class="form-group row">
    <label for="password" class="col-form-label col-sm-2">密码</label>
    <input type="password" class="form-control col-sm-10" name="password">
  </div>
  <input type="submit" class="btn btn-primary" value="登录">
</form>
{% end %}
